name: Sync Tutorials

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: '0 3 * * *'
  push:
    paths:
      - '.github/workflows/sync-tutorials.yml'
      - 'tools/sync_tutorials.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tutorials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sync Script
        run: |
          python3 tools/sync_tutorials.py \
            --module-toml config/_default/module.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            config/_default/module.toml
          commit-message: "Update tutorials module mounts"
          branch: auto-sync-tutorials
          title: "Automated: Sync new tutorials from precice/tutorials"
          body: |
            This PR automatically synchronizes the Hugo module mounts with the latest tutorials available in the `precice/tutorials` repository.

            Generated by `.github/workflows/sync-tutorials.yml` using `tools/sync_tutorials.py`.
          labels: "automated, documentation"
          delete-branch: true
