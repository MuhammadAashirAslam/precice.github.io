name: Sync tutorials

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-tutorials
  cancel-in-progress: false

jobs:
  sync-tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install "PyYAML==6.0.3"

      - name: Synchronize tutorial mounts and navigation
        run: >-
          python tools/sync_tutorials.py
          --module-toml config/_default/module.toml
          --sidebar-yaml data/sidebars/tutorial_sidebar.yml

      - name: Create update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          add-paths: |
            config/_default/module.toml
            data/sidebars/tutorial_sidebar.yml
          commit-message: "Update tutorial mounts and sidebar"
          branch: auto-sync-tutorials
          title: "Update tutorial mounts and sidebar"
          body: |
            Synchronizes Hugo module mounts and sidebar navigation with the
            tutorials currently available in `precice/tutorials`.

            Generated by `tools/sync_tutorials.py`.
          labels: automated, documentation
          delete-branch: true
