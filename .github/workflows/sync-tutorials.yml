name: Sync Tutorials

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-tutorials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can detect changes
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Sync Script
        run: |
          python3 tools/sync_tutorials.py \
            --module-toml config/_default/module/tutorials.toml \
            --sidebar-yaml _data/sidebars/tutorial_sidebar.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update tutorials module mounts and sidebar"
          branch: auto-sync-tutorials
          title: "Automated: Sync new tutorials from precice/tutorials"
          body: |
            This PR automatically synchronizes the Hugo module mounts and sidebar configuration with the latest tutorials available in the `precice/tutorials` repository.
            
            Generated by `.github/workflows/sync-tutorials.yml` using `tools/sync_tutorials.py`.
          labels: "automated, documentation"
          delete-branch: true
