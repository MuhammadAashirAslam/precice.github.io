name: Update the Algolia search index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Algolia CLI tests
        run: npm run test:algolia

      - name: Build Hugo Algolia export
        env:
          GOFLAGS: "-mod=mod"
          GOPROXY: "https://proxy.golang.org,direct"
          GONOSUMDB: "github.com/precice/tutorials,github.com/precice/code_aster-adapter"
        run: hugo --gc --minify

      - name: Validate generated Algolia records
        run: npm run algolia:index -- --dry-run

      - name: Replace Algolia records
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: npm run algolia:index
